<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inovamagic</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <a class="logo" href="#">Inovamagic</a>
  <input id="search" type="search" placeholder="Buscar productos o locales">
  <button id="openCart" class="cart-btn" aria-label="Abrir carrito">Carrito <span id="count">0</span></button>
</header>

<nav id="cats" class="cats" aria-label="Categorías"></nav>

<main>
  <h1 id="title">Todo en un solo lugar</h1>
  <section id="grid" class="grid"></section>
</main>

<aside id="drawer" class="drawer" hidden>
  <div class="drawer-head"><h2 id="drawerTitle">Tu carrito</h2><button id="closeCart" aria-label="Cerrar">✕</button></div>
  <div id="drawerBody"></div>
</aside>
<div id="shade" class="shade" hidden></div>
<div id="detail" class="detail" hidden role="dialog" aria-modal="true"><div id="detailBody"></div></div>

<script src="shops.js"></script>
<script src="app.js"></script>
<script type="module" src="store-data.js"></script>
</body>
</html>
